<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Pribadi - Jayaptayu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #8b949e;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      background-color: #238636;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Halo, Selamat Datang! 👋</h1>
    <p>Ini adalah website pribadi pertama saya yang dibuat menggunakan GitHub Pages.</p>
    <a href="https://github.com" class="btn">Kunjungi Profil GitHub</a>
  </div>
</body>
</html>
